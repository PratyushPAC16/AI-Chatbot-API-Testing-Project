name: AI Chatbot API – Test Suite CI

on:
  # ── Trigger 1: Push / PR to main ────────────────────────────
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # ── Trigger 2: Nightly at midnight UTC ──────────────────────
  schedule:
    - cron: '0 0 * * *'

  # ── Trigger 3: Manual run with suite selector ───────────────
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Which test suite to run?'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - functional
          - edge_cases
          - regression
          - security

# ── Give the workflow the permissions it needs ────────────────
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:

  # ── Job 1a: Python Tests ─────────────────────────────────────
  python-tests:
    name: 🐍 Python Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Cache sentence-transformer model ─────────────────────
      # The all-MiniLM-L6-v2 model is ~80 MB. Caching it means
      # CI doesn't re-download it on every run.
      - name: Cache sentence-transformers model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-sentence-transformers-all-MiniLM-L6-v2
          restore-keys: |
            ${{ runner.os }}-sentence-transformers-

      - name: Create required directories
        run: mkdir -p logs reports bug_reports reports/allure-results

      - name: Start Mock API server
        run: |
          python src/mock_server/app.py &
          sleep 5
          curl -f http://localhost:5001/health

      # ── Resolve which suite to run ───────────────────────────
      # For push/PR/schedule, default to "all".
      # For manual triggers, use the dropdown value.
      - name: Resolve test suite selection
        id: suite
        run: |
          SUITE="${{ github.event.inputs.test_suite }}"
          if [ -z "$SUITE" ]; then
            SUITE="all"
          fi
          echo "selected=$SUITE" >> "$GITHUB_OUTPUT"
          echo "Running suite: $SUITE"

      # ── Functional tests ─────────────────────────────────────
      - name: Run functional tests with Allure
        if: |
          steps.suite.outputs.selected == 'all' ||
          steps.suite.outputs.selected == 'functional'
        run: |
          pytest tests/functional/test_functional.py -v \
            --tb=short \
            --alluredir=reports/allure-results \
            --junitxml=reports/functional_results.xml
        continue-on-error: true

      # ── Edge case tests ──────────────────────────────────────
      - name: Run edge case tests with Allure
        if: |
          steps.suite.outputs.selected == 'all' ||
          steps.suite.outputs.selected == 'edge_cases'
        run: |
          pytest tests/edge_cases/test_edge_cases.py -v \
            --tb=short \
            --alluredir=reports/allure-results \
            --junitxml=reports/edge_results.xml
        continue-on-error: true

      # ── Regression tests ─────────────────────────────────────
      - name: Run regression tests with Allure
        if: |
          steps.suite.outputs.selected == 'all' ||
          steps.suite.outputs.selected == 'regression'
        run: |
          pytest tests/regression/test_regression.py -v \
            --tb=short \
            --alluredir=reports/allure-results \
            --junitxml=reports/regression_results.xml
        continue-on-error: true

      # ── Semantic validator tests ──────────────────────────────
      - name: Run semantic validator tests
        if: |
          steps.suite.outputs.selected == 'all' ||
          steps.suite.outputs.selected == 'functional'
        run: |
          pytest tests/functional/test_semantic_validator.py -v \
            --tb=short \
            --alluredir=reports/allure-results \
            --junitxml=reports/semantic_results.xml
        continue-on-error: true

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: reports/allure-results/
          retention-days: 14

      - name: Upload JUnit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-reports
          path: reports/
          retention-days: 14

  # ── Job 1b: Security Tests ────────────────────────────────────
  security-tests:
    name: 🔒 Security Tests
    runs-on: ubuntu-latest
    needs: python-tests
    # Skip this job when a manual run targets a non-security suite
    if: |
      github.event.inputs.test_suite == '' ||
      github.event.inputs.test_suite == 'all' ||
      github.event.inputs.test_suite == 'security'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create required directories
        run: mkdir -p logs reports bug_reports

      - name: Start Mock API server
        run: |
          python src/mock_server/app.py &
          sleep 5

      - name: Run security tests
        run: |
          pytest tests/security/test_security.py -v \
            --tb=short \
            --junitxml=reports/security_results.xml

      - name: Upload security test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-report
          path: reports/security_results.xml
          retention-days: 14

  # ── Job 2: Newman Tests ───────────────────────────────────────
  newman-tests:
    name: 📮 Newman / Postman Tests
    runs-on: ubuntu-latest
    needs: [python-tests, security-tests]
    # Only run on push/PR/schedule — not on manual single-suite runs
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.test_suite == 'all'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Create required directories
        run: mkdir -p logs reports bug_reports

      - name: Start Mock API server
        run: |
          python src/mock_server/app.py &
          sleep 5

      - name: Run Postman collection
        run: |
          newman run postman/chatbot_api_collection.json \
            --environment postman/environment.json \
            --reporters cli,junit \
            --reporter-junit-export reports/newman_results.xml \
            --suppress-exit-code

      - name: Upload Newman report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: reports/newman_results.xml
          retention-days: 14

  # ── Job 3: Load Test ──────────────────────────────────────────
  load-test:
    name: 🔥 Load Test (Locust)
    runs-on: ubuntu-latest
    needs: python-tests
    # Run on push to main, nightly schedule, or manual "all" — not on PRs
    if: |
      (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.test_suite == 'all')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create required directories
        run: mkdir -p logs reports bug_reports

      - name: Start Mock API server
        run: |
          python src/mock_server/app.py &
          sleep 5

      - name: Run Locust load test
        run: |
          locust \
            -f locust/locustfile.py \
            --host=http://localhost:5001 \
            --users 10 \
            --spawn-rate 2 \
            --run-time 30s \
            --headless \
            --csv reports/locust_stats \
            || true

      - name: Upload load test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-report
          path: reports/
          retention-days: 14

  # ── Job 4: Slack Notify on Failure ───────────────────────────
  notify:
    name: 🔔 Slack Notify on Failure
    runs-on: ubuntu-latest
    needs: [python-tests, security-tests, newman-tests, load-test]
    if: failure()

    steps:
      - name: Send Slack failure alert
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          ACTOR="${{ github.actor }}"
          RUN_ID="${{ github.run_id }}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          # Label the trigger source so Slack message is self-explanatory
          EVENT="${{ github.event_name }}"
          if [ "$EVENT" = "schedule" ]; then
            TRIGGER="⏰ Nightly scheduled run"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            SUITE="${{ github.event.inputs.test_suite }}"
            TRIGGER="🖱️ Manual trigger (suite: ${SUITE})"
          else
            TRIGGER="🔀 Push / Pull Request"
          fi

          PAYLOAD=$(cat <<EOF
          {
            "text": "🚨 *CI Pipeline Failed*",
            "attachments": [
              {
                "color": "#FF0000",
                "fields": [
                  { "title": "Repository", "value": "${REPO}",                       "short": true  },
                  { "title": "Branch",     "value": "${BRANCH}",                     "short": true  },
                  { "title": "Commit",     "value": "\`${SHORT_SHA}\`",              "short": true  },
                  { "title": "Pushed by",  "value": "${ACTOR}",                      "short": true  },
                  { "title": "Trigger",    "value": "${TRIGGER}",                    "short": false },
                  { "title": "Run URL",    "value": "<${RUN_URL}|View Failed Run>",  "short": false }
                ],
                "footer": "GitHub Actions",
                "ts": $(date +%s)
              }
            ]
          }
          EOF
          )

          curl -s -X POST \
            -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"