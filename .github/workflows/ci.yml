name: AI Chatbot API – Test Suite CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# ── Give the workflow the permissions it needs ────────────────
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:

  # ── Job 1a: Python Tests ─────────────────────────────────────
  python-tests:
    name: 🐍 Python Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create required directories
        run: mkdir -p logs reports bug_reports reports/allure-results

      - name: Start Mock API server
        run: |
          python src/mock_server/app.py &
          sleep 5
          curl -f http://localhost:5001/health

      - name: Run functional tests with Allure
        run: |
          pytest tests/functional/test_functional.py -v \
            --tb=short \
            --alluredir=reports/allure-results \
            --junitxml=reports/functional_results.xml
        continue-on-error: true

      - name: Run edge case tests with Allure
        run: |
          pytest tests/edge_cases/test_edge_cases.py -v \
            --tb=short \
            --alluredir=reports/allure-results \
            --junitxml=reports/edge_results.xml
        continue-on-error: true

      - name: Run regression tests with Allure
        run: |
          pytest tests/regression/test_regression.py -v \
            --tb=short \
            --alluredir=reports/allure-results \
            --junitxml=reports/regression_results.xml
        continue-on-error: true

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: reports/allure-results/
          retention-days: 14

      - name: Upload JUnit reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-reports
          path: reports/
          retention-days: 14

  # ── Job 1b: Security Tests ────────────────────────────────────
  security-tests:
    name: 🔒 Security Tests
    runs-on: ubuntu-latest
    needs: python-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create required directories
        run: mkdir -p logs reports bug_reports

      - name: Start Mock API server
        run: |
          python src/mock_server/app.py &
          sleep 5

      - name: Run security tests
        run: |
          pytest tests/security/test_security.py -v \
            --tb=short \
            --junitxml=reports/security_results.xml

      - name: Upload security test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-report
          path: reports/security_results.xml
          retention-days: 14

  # ── Job 2: Newman Tests ───────────────────────────────────────
  newman-tests:
    name: 📮 Newman / Postman Tests
    runs-on: ubuntu-latest
    needs: [python-tests, security-tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: Create required directories
        run: mkdir -p logs reports bug_reports

      - name: Start Mock API server
        run: |
          python src/mock_server/app.py &
          sleep 5

      - name: Run Postman collection
        run: |
          newman run postman/chatbot_api_collection.json \
            --environment postman/environment.json \
            --reporters cli,junit \
            --reporter-junit-export reports/newman_results.xml \
            --suppress-exit-code

      - name: Upload Newman report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: reports/newman_results.xml
          retention-days: 14

  # ── Job 3: Load Test ──────────────────────────────────────────
  load-test:
    name: 🔥 Load Test (Locust)
    runs-on: ubuntu-latest
    needs: python-tests
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create required directories
        run: mkdir -p logs reports bug_reports

      - name: Start Mock API server
        run: |
          python src/mock_server/app.py &
          sleep 5

      - name: Run Locust load test
        run: |
          locust \
            -f locust/locustfile.py \
            --host=http://localhost:5001 \
            --users 10 \
            --spawn-rate 2 \
            --run-time 30s \
            --headless \
            --csv reports/locust_stats \
            || true

      - name: Upload load test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-report
          path: reports/
          retention-days: 14

  # ── Job 4: Slack Notify on Failure ───────────────────────────
  notify:
    name: 🔔 Slack Notify on Failure
    runs-on: ubuntu-latest
    # Run after ALL jobs; only proceed when at least one failed
    needs: [python-tests, security-tests, newman-tests, load-test]
    if: failure()

    steps:
      - name: Send Slack failure alert
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # Build a short, informative payload
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          ACTOR="${{ github.actor }}"
          RUN_ID="${{ github.run_id }}"
          RUN_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          PAYLOAD=$(cat <<EOF
          {
            "text": "🚨 *CI Pipeline Failed*",
            "attachments": [
              {
                "color": "#FF0000",
                "fields": [
                  { "title": "Repository", "value": "${REPO}",                       "short": true },
                  { "title": "Branch",     "value": "${BRANCH}",                     "short": true },
                  { "title": "Commit",     "value": "\`${SHORT_SHA}\`",              "short": true },
                  { "title": "Pushed by",  "value": "${ACTOR}",                      "short": true },
                  { "title": "Run URL",    "value": "<${RUN_URL}|View Failed Run>",  "short": false }
                ],
                "footer": "GitHub Actions",
                "ts": $(date +%s)
              }
            ]
          }
          EOF
          )

          curl -s -X POST \
            -H 'Content-type: application/json' \
            --data "$PAYLOAD" \
            "$SLACK_WEBHOOK_URL"