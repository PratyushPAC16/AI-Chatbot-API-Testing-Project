name: AI Chatbot API – Test Suite CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run nightly at 02:00 UTC for regression monitoring
    - cron: '0 2 * * *'

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Python test suite (pytest)
  # ─────────────────────────────────────────────────────────────────────────────
  python-tests:
    name: 🐍 Python Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Start Mock API server
        run: |
          python src/mock_server/app.py &
          echo "Waiting for server to start..."
          sleep 3
          curl -f http://localhost:5001/health || (echo "❌ Server failed to start" && exit 1)
          echo "✅ Server is running"

      - name: 🧪 Run functional tests
        run: |
          pytest tests/functional/ -v \
            --tb=short \
            --junitxml=reports/functional_results.xml \
            -m "not slow"

      - name: 🧪 Run edge case tests
        run: |
          pytest tests/edge_cases/ -v \
            --tb=short \
            --junitxml=reports/edge_case_results.xml

      - name: 🧪 Run regression tests
        run: |
          pytest tests/regression/ -v \
            --tb=short \
            --junitxml=reports/regression_results.xml

      - name: 🧪 Run full test suite with coverage
        run: |
          pytest tests/ -v \
            --tb=long \
            --junitxml=reports/full_results.xml \
            --html=reports/test_report.html \
            --self-contained-html \
            || true   # Don't fail CI if tests fail; let report generation run

      - name: 📊 Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-test-reports
          path: reports/
          retention-days: 30

      - name: 📊 Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: logs/
          retention-days: 7

      - name: 📋 Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Pytest Results
          path: reports/full_results.xml
          reporter: java-junit
          fail-on-error: false

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Newman (Postman CLI)
  # ─────────────────────────────────────────────────────────────────────────────
  newman-tests:
    name: 📮 Newman / Postman Tests
    runs-on: ubuntu-latest
    needs: python-tests   # Run after Python tests pass

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: 📦 Install Python dependencies
        run: pip install -r requirements.txt

      - name: 🟢 Install Newman
        run: npm install -g newman newman-reporter-htmlextra

      - name: 🚀 Start Mock API server
        run: |
          python src/mock_server/app.py &
          sleep 3
          curl -f http://localhost:5001/health

      - name: 📮 Run Postman collection via Newman
        run: |
          newman run postman/chatbot_api_collection.json \
            --environment postman/environment.json \
            --reporters cli,htmlextra,junit \
            --reporter-htmlextra-export reports/newman_report.html \
            --reporter-junit-export     reports/newman_results.xml \
            --bail \
            || true

      - name: 📊 Upload Newman report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-report
          path: reports/newman_report.html
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Load test (Locust headless, 30s smoke)
  # ─────────────────────────────────────────────────────────────────────────────
  load-test:
    name: 🔥 Load Test (Locust)
    runs-on: ubuntu-latest
    needs: python-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🚀 Start Mock API server
        run: |
          python src/mock_server/app.py &
          sleep 3

      - name: 🔥 Run Locust smoke load test (10 users, 30s)
        run: |
          locust \
            -f locust/locustfile.py \
            --host=http://localhost:5001 \
            --users 10 \
            --spawn-rate 2 \
            --run-time 30s \
            --headless \
            --html reports/locust_report.html \
            --csv  reports/locust_stats \
            || true

      - name: 📊 Upload load test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-report
          path: reports/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Notify on failure
  # ─────────────────────────────────────────────────────────────────────────────
  notify:
    name: 🔔 Notify
    runs-on: ubuntu-latest
    needs: [python-tests, newman-tests]
    if: failure()

    steps:
      - name: ❌ Test failure notification
        run: |
          echo "Tests failed on branch ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.actor }}"
          # Add Slack/email webhook here in production:
          # curl -X POST -H 'Content-type: application/json' \
          #   --data '{"text":"❌ QA Tests FAILED on ${{ github.ref }}"}' \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}
