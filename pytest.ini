[pytest]
# ─── Test discovery ─────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ─── Output ─────────────────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# ─── Markers ────────────────────────────────────────────────────────────────
markers =
    smoke:       Fast sanity checks (subset of tests for quick CI runs)
    regression:  Regression tests for previously fixed bugs
    edge_case:   Boundary and unusual input tests
    performance: Tests that check response time
    slow:        Tests that take > 2 seconds (excluded from fast CI runs)
    ai_validation: Tests that use the AI response validator

# ─── Logging ────────────────────────────────────────────────────────────────
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
